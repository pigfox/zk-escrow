name: CI

# Everything here runs on a clean checkout with NO secrets. The escrow's build,
# test, fuzz and analysis paths never read ../.env — only deploying, upgrading
# and running the arbiter agent need credentials, and none of that happens here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # PIGFOX SOLIDITY PIPELINE v1 — the estate's one verification standard, defined
  # once in pigfox/solidity-pipeline and consumed here rather than copied.
  #
  # This repo is where most of the pipeline came FROM: the forced rebuild before
  # fuzzing, the property-count assertion, the coverage gate that refuses to pass
  # on a report it cannot parse, and the doctrine gate that plants a token to
  # prove it still matches. Those were written here, then factored out so the
  # other three repos get them too — and so a fix lands once instead of four
  # times. The version here is the factored one, plus the guards the other three
  # repos contributed on the way.
  #
  # The gate SCRIPTS come from lib/solidity-pipeline, vendored as a submodule at a
  # commit this repo pins, so a local run and this run are the same bytes.
  #
  # https://github.com/pigfox/solidity-pipeline
  pipeline:
    uses: pigfox/solidity-pipeline/.github/workflows/solidity.yml@v1
    with:
      # test/Properties.sol declares six echidna_* predicates and states the same
      # number in pigfoxPropertyCount(). Both fuzzers assert they registered
      # exactly this many. That guard exists because of this repo: a stale
      # crytic-export once shrank a five-property set to four and the job passed.
      #
      # Bump this, pigfoxPropertyCount() and the predicate together, in one commit.
      expected-properties: 6

      # src/Verifier.sol is generated verbatim by snarkjs from the proving key.
      # Its residual uncovered lines are the inline-assembly early exits taken
      # when the BN254 ecAdd / ecMul / pairing precompiles themselves report
      # failure. Those cannot be made to fail from a test: inputs that are merely
      # wrong are rejected by the reachable `checkField` branch, which IS covered.
      # Excluded BY NAME — the gate prints it as SKIP and fails the build if the
      # name ever stops matching a real file — and the verifier is still
      # exercised end-to-end by real Groth16 proofs in test/ZkRelease.t.sol.
      coverage-exclusions: src/Verifier.sol

      # fmt-paths is deliberately ABSENT now, so this repo takes the pipeline
      # default of `src test script` like every other consuming repo. It used to
      # be narrowed to `test` because src/ and script/ carried three pre-existing
      # violations; PF-S123 formatted those three files, so the carve-out is gone
      # rather than merely documented. src/Verifier.sol remains in foundry.toml's
      # [fmt] ignore, so widening this can never reformat generated output.

  # ---------------------------------------------------------------------------
  # Repo-specific, and deliberately NOT in the shared pipeline: the pipeline
  # covers Solidity, and does not try to be everything.
  go:
    name: go agent (vet, lint, test, 100% coverage gate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.1.0
        with:
          # Track agent/go.mod rather than pinning a number here, so the
          # toolchain can never drift below what the module requires.
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # v2 of golangci-lint is required: the v1.x binaries are built with
          # Go 1.24 and refuse to lint a module targeting a newer Go than they
          # were built with. agent/.golangci.yml is in the v2 schema to match.
          version: v2.12.2
          working-directory: agent

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage gate (100.0% statements)
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -20
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "::error::Go coverage is $total, required 100.0%"
            echo "Uncovered statements:"
            go tool cover -func=coverage.out | awk '$NF != "100.0%" && !/^total:/'
            exit 1
          fi
          echo "Go coverage gate passed: $total"
